

apiVersion: v1
kind: Namespace
metadata:
  name: trading
  labels:
    app: trading-platform

---


apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-ingress
  namespace: trading
  annotations:
    
    kubernetes.io/ingress.class: alb

   
    alb.ingress.kubernetes.io/scheme: internet-facing

    alb.ingress.kubernetes.io/target-type: ip

   
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:YOUR_ACCOUNT_ID:certificate/YOUR_CERT_ID

   
    alb.ingress.kubernetes.io/ssl-redirect: "443"

    
    alb.ingress.kubernetes.io/healthcheck-path: /health

spec:
  rules:
    
    - host: api.yourtradingapp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000

    
    - host: yourtradingapp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

    
    - host: dashboard.yourtradingapp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard-service
                port:
                  number: 80