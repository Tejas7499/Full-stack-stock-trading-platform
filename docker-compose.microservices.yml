

services:
  api-gateway:
    build: ./backend/services/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AUTH_SERVICE=http://auth-service:3001
      - PORTFOLIO_SERVICE=http://portfolio-service:3002
      - ORDER_SERVICE=http://order-service:3003
      - STOCK_SERVICE=http://stock-service:3004
    depends_on:
      - auth-service

  auth-service:
    build: ./backend/services/auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://mongo:27017/trading
      - JWT_SECRET=your_secret_key
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: trading-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: