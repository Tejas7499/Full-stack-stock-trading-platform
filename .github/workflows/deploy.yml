name: Trading Platform — CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- Phase 1: Continuous Integration (CI) ---
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Create temporary .env for Docker Compose
        # This securely passes your GitHub secrets into the build environment
        run: |
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env

      - name: Verify Docker Compose Build
        run: docker compose -f docker-compose.microservices.yml build

  # --- Phase 2: Continuous Deployment (CD) ---
  deploy-to-ec2:
    needs: build-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Execute Remote SSH Commands to Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Clone repo if it doesn't exist yet, otherwise pull latest changes
            if [ ! -d "Full-stack-stock-trading-platform" ]; then
              git clone https://github.com/Tejas7499/Full-stack-stock-trading-platform.git
            fi
            
            cd Full-stack-stock-trading-platform
            git pull origin main
            
            # Inject secrets into the EC2 environment
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > .env
            echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
            
            # Deploy using Docker Compose V2
            docker compose -f docker-compose.microservices.yml up -d --build
            docker system prune -f