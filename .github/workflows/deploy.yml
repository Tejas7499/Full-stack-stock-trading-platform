name: Trading Platform — CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- Phase 1: Continuous Integration (CI) ---
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Verify Docker Compose Build
        # This confirms your microservices can build successfully without syntax errors
        run: docker-compose -f docker-compose.microservices.yml build

  # --- Phase 2: Continuous Deployment (CD) ---
  deploy-to-ec2:
    needs: build-and-validate # Ensures deployment only happens if the build passes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only deploy when pushing to main
    steps:
      - name: Execute Remote SSH Commands to Deploy
        uses: appleboy/ssh-action@master
        # This step will be skipped/fail gracefully until EC2 secrets are added
        continue-on-error: true 
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd Full-stack-stock-trading-platform
            git pull origin main
            
            # Safely inject secrets into the EC2 environment
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > .env
            echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
            
            # Deploy using the designated microservices compose file
            docker-compose -f docker-compose.microservices.yml up -d --build
            docker system prune -f